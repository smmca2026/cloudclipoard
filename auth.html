<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Clipboard - Authentication</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a1128 0%, #1c2541 50%, #0b132b 100%);
            --card-bg: rgba(25, 38, 70, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-blue: #3a86ff;
            --accent-blue-hover: #2563eb;
            --accent-cyan: #00f0ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
            --radius-lg: 18px;
            --radius-md: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .auth-container {
            width: 100%;
            max-width: 430px;
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 38px 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .auth-logo {
            font-size: 40px;
            margin-bottom: 8px;
            display: inline-block;
            filter: drop-shadow(0 4px 12px rgba(58, 134, 255, 0.45));
            animation: floatLogo 3s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .auth-title {
            font-size: 25px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Tab Switcher */
        .tab-switcher {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(15, 23, 42, 0.75);
            padding: 4px;
            border-radius: var(--radius-md);
            margin-bottom: 22px;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 2px 12px rgba(58, 134, 255, 0.4);
        }

        /* In-page Live Alert Banner */
        .alert-box {
            display: none;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            margin-bottom: 18px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-box.success {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .alert-box.error {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .alert-box.warning {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        /* Form Inputs */
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            padding: 13px 46px 13px 14px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(58, 134, 255, 0.25);
        }

        .input-wrapper input.input-error {
            border-color: var(--accent-red) !important;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25) !important;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Eye Icon Button Toggle */
        .eye-toggle-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            padding: 7px;
            border-radius: 8px;
            transition: all 0.2s ease;
            z-index: 5;
        }

        .eye-toggle-btn:hover {
            color: var(--accent-cyan);
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.08);
        }

        .eye-toggle-btn:active {
            transform: scale(0.95);
        }

        .eye-toggle-btn svg {
            width: 20px;
            height: 20px;
            display: block;
            pointer-events: none;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 13px;
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background: var(--accent-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(58, 134, 255, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .form-footer {
            margin-top: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .forgot-link {
            color: var(--accent-cyan);
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            text-decoration: underline;
            color: #ffffff;
        }

        .switch-link {
            color: var(--accent-blue);
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-link:hover {
            text-decoration: underline;
            color: var(--accent-cyan);
        }

        /* Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ----------------------------------------------------
           Modern In-Page Popup Modal (No White Page Redirect!)
        ----------------------------------------------------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 10, 25, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            width: 100%;
            max-width: 400px;
            background: rgba(22, 34, 62, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-lg);
            padding: 30px 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
            text-align: center;
            position: relative;
            transform: scale(0.9) translateY(10px);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-close-btn {
            position: absolute;
            top: 14px;
            right: 16px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            line-height: 1;
            transition: color 0.2s;
        }

        .modal-close-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-icon-wrap {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .modal-icon-wrap.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 24px rgba(239, 68, 68, 0.3);
        }

        .modal-icon-wrap.warning {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-yellow);
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 0 24px rgba(245, 158, 11, 0.3);
        }

        .modal-icon-wrap.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.4);
            box-shadow: 0 0 24px rgba(16, 185, 129, 0.3);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .modal-message {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
        }

        .modal-btn-primary {
            background: var(--accent-blue);
            color: #ffffff;
        }

        .modal-btn-primary:hover {
            background: var(--accent-blue-hover);
            transform: translateY(-1px);
        }

        .modal-btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .modal-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Main Auth Card -->
    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <span class="auth-logo">☁️</span>
            <h1 class="auth-title" id="authTitle">Welcome Back</h1>
            <p class="auth-subtitle" id="authSubtitle">Log in to sync your clipboard across devices</p>
        </div>

        <!-- Tab Switcher -->
        <div class="tab-switcher">
            <button type="button" class="tab-btn active" id="loginTabBtn" onclick="switchAuthTab('login')">Login</button>
            <button type="button" class="tab-btn" id="signupTabBtn" onclick="switchAuthTab('signup')">Sign Up</button>
        </div>

        <!-- In-page Live Alert Message -->
        <div id="alertBox" class="alert-box">
            <span id="alertIcon"></span>
            <span id="alertMessage"></span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLoginSubmit(event)" autocomplete="on">
            <div class="input-group">
                <label for="loginEmail">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="loginEmail" name="email" placeholder="name@example.com" required autocomplete="email" oninput="syncEmailBetweenTabs('login')">
                </div>
            </div>

            <div class="input-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    <!-- Password Eye Icon Toggle: Eye Closed (Default) -> Eye Open (Revealed) -->
                    <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" title="Show password" aria-label="Show password">
                        <!-- Eye Closed Icon (Shown when password is masked) -->
                        <svg class="eye-icon-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                        <!-- Eye Open Icon (Shown when password is plain text) -->
                        <svg class="eye-icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="loginSubmitBtn">
                <span class="btn-text">Log In</span>
            </button>

            <div class="form-footer">
                <a href="forgot.html" id="forgotPasswordLink" class="forgot-link" onclick="handleForgotClick(event)">Forgot Password?</a>
                <span>New here? <a href="javascript:void(0)" class="switch-link" onclick="switchAuthTab('signup')">Sign Up</a></span>
            </div>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" style="display: none;" onsubmit="handleSignupSubmit(event)" autocomplete="on">
            <div class="input-group">
                <label for="signupEmail">Email Address</label>
                <div class="input-wrapper">
                    <input type="email" id="signupEmail" name="email" placeholder="name@example.com" required autocomplete="email" oninput="syncEmailBetweenTabs('signup')">
                </div>
            </div>

            <div class="input-group">
                <label for="signupPassword">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="signupPassword" name="password" placeholder="Create a strong password" required autocomplete="new-password">
                    <!-- Password Eye Icon Toggle: Eye Closed (Default) -> Eye Open (Revealed) -->
                    <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility('signupPassword', this)" title="Show password" aria-label="Show password">
                        <!-- Eye Closed Icon (Shown when password is masked) -->
                        <svg class="eye-icon-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                        <!-- Eye Open Icon (Shown when password is plain text) -->
                        <svg class="eye-icon-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="signupSubmitBtn">
                <span class="btn-text">Create Account</span>
            </button>

            <div class="form-footer" style="justify-content: center;">
                <span>Already have an account? <a href="javascript:void(0)" class="switch-link" onclick="switchAuthTab('login')">Log In</a></span>
            </div>
        </form>
    </div>

    <!-- ----------------------------------------------------
         In-Page Error / Notification Popup Modal
    ----------------------------------------------------- -->
    <div id="authModalOverlay" class="modal-overlay" onclick="handleOverlayClick(event)">
        <div class="modal-card">
            <button type="button" class="modal-close-btn" onclick="closeAuthModal()" title="Close popup">&times;</button>
            <div id="modalIconWrap" class="modal-icon-wrap error">
                <span id="modalIcon">⚠️</span>
            </div>
            <h3 id="modalTitle" class="modal-title">Invalid Password</h3>
            <p id="modalMessage" class="modal-message">The password you entered is incorrect. Please check and try again.</p>
            <div id="modalActions" class="modal-actions">
                <button type="button" class="modal-btn modal-btn-primary" id="modalPrimaryBtn" onclick="closeAuthModal(true)">Try Again</button>
                <a href="forgot.html" class="modal-btn modal-btn-secondary" id="modalSecondaryBtn">Forgot Password?</a>
            </div>
        </div>
    </div>

    <script>
        // Track focus target after closing modal
        let pendingFocusInputId = null;

        // 1. Password Visibility Eye Toggle (Open / Closed toggle)
        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            if (!input) return;

            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';

            const closedIcon = button.querySelector('.eye-icon-closed');
            const openIcon = button.querySelector('.eye-icon-open');

            if (isPassword) {
                // Now showing plain text password -> Show Eye Open Icon
                if (closedIcon) closedIcon.style.display = 'none';
                if (openIcon) openIcon.style.display = 'block';
                button.setAttribute('aria-label', 'Hide password');
                button.setAttribute('title', 'Hide password');
            } else {
                // Now hiding password -> Show Eye Closed Icon
                if (closedIcon) closedIcon.style.display = 'block';
                if (openIcon) openIcon.style.display = 'none';
                button.setAttribute('aria-label', 'Show password');
                button.setAttribute('title', 'Show password');
            }
        }

        // 2. Sync Email between Login and Sign Up tabs
        function syncEmailBetweenTabs(fromTab) {
            if (fromTab === 'login') {
                const email = document.getElementById('loginEmail').value;
                document.getElementById('signupEmail').value = email;
            } else {
                const email = document.getElementById('signupEmail').value;
                document.getElementById('loginEmail').value = email;
            }
        }

        // 3. Switch between Login and Sign Up tabs
        function switchAuthTab(mode) {
            clearAlert();
            removeInputErrors();

            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const signupTabBtn = document.getElementById('signupTabBtn');
            const authTitle = document.getElementById('authTitle');
            const authSubtitle = document.getElementById('authSubtitle');

            const loginEmail = document.getElementById('loginEmail');
            const signupEmail = document.getElementById('signupEmail');

            if (mode === 'signup') {
                // Preserve same email ID when switching to signup
                if (loginEmail.value.trim()) {
                    signupEmail.value = loginEmail.value.trim();
                }

                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                loginTabBtn.classList.remove('active');
                signupTabBtn.classList.add('active');
                authTitle.textContent = 'Create Account';
                authSubtitle.textContent = 'Sign up to start sharing files and clipboard in real time';

                setTimeout(() => {
                    if (signupEmail.value) {
                        document.getElementById('signupPassword').focus();
                    } else {
                        signupEmail.focus();
                    }
                }, 50);
            } else {
                // Preserve same email ID when switching to login
                if (signupEmail.value.trim()) {
                    loginEmail.value = signupEmail.value.trim();
                }

                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                loginTabBtn.classList.add('active');
                signupTabBtn.classList.remove('active');
                authTitle.textContent = 'Welcome Back';
                authSubtitle.textContent = 'Log in to sync your clipboard across devices';

                setTimeout(() => {
                    if (loginEmail.value) {
                        document.getElementById('loginPassword').focus();
                    } else {
                        loginEmail.focus();
                    }
                }, 50);
            }
        }

        // 4. Handle Forgot Password link click (passes currently typed email)
        function handleForgotClick(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim() || document.getElementById('signupEmail').value.trim();
            if (email) {
                window.location.href = `forgot.html?email=${encodeURIComponent(email)}`;
            } else {
                window.location.href = 'forgot.html';
            }
        }

        // 5. In-Page Pop-up Modal System
        function showAuthModal(options) {
            const overlay = document.getElementById('authModalOverlay');
            const iconWrap = document.getElementById('modalIconWrap');
            const icon = document.getElementById('modalIcon');
            const title = document.getElementById('modalTitle');
            const message = document.getElementById('modalMessage');
            const primaryBtn = document.getElementById('modalPrimaryBtn');
            const secondaryBtn = document.getElementById('modalSecondaryBtn');

            const type = options.type || 'error';
            iconWrap.className = `modal-icon-wrap ${type}`;
            
            if (type === 'error') {
                icon.textContent = '❌';
            } else if (type === 'warning') {
                icon.textContent = '⚠️';
            } else {
                icon.textContent = '✅';
            }

            title.textContent = options.title || 'Notification';
            message.textContent = options.message || '';
            pendingFocusInputId = options.focusInputId || null;

            // Configure action buttons
            if (options.customAction === 'login_with_email') {
                primaryBtn.textContent = '👉 Log In with this Email';
                primaryBtn.onclick = () => {
                    closeAuthModal(false);
                    switchAuthTab('login');
                    if (options.email) document.getElementById('loginEmail').value = options.email;
                    document.getElementById('loginPassword').focus();
                };
                secondaryBtn.style.display = 'none';
            } else if (options.customAction === 'invalid_password') {
                primaryBtn.textContent = 'Try Again';
                primaryBtn.onclick = () => closeAuthModal(true);
                secondaryBtn.style.display = 'block';
                secondaryBtn.textContent = 'Forgot Password?';
                secondaryBtn.href = options.email ? `forgot.html?email=${encodeURIComponent(options.email)}` : 'forgot.html';
            } else {
                primaryBtn.textContent = options.primaryText || 'Got it';
                primaryBtn.onclick = () => closeAuthModal(true);
                if (options.secondaryText) {
                    secondaryBtn.style.display = 'block';
                    secondaryBtn.textContent = options.secondaryText;
                    secondaryBtn.href = options.secondaryHref || '#';
                } else {
                    secondaryBtn.style.display = 'none';
                }
            }

            overlay.classList.add('active');
        }

        function closeAuthModal(shouldFocus = false) {
            const overlay = document.getElementById('authModalOverlay');
            overlay.classList.remove('active');

            if (shouldFocus && pendingFocusInputId) {
                const target = document.getElementById(pendingFocusInputId);
                if (target) {
                    target.classList.add('input-error');
                    target.focus();
                    target.select();
                }
            }
        }

        function handleOverlayClick(e) {
            if (e.target === document.getElementById('authModalOverlay')) {
                closeAuthModal(true);
            }
        }

        // 6. In-Page Inline Alert Banner
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alertBox');
            const alertIcon = document.getElementById('alertIcon');
            const alertMessage = document.getElementById('alertMessage');

            alertBox.className = `alert-box ${type}`;
            alertIcon.textContent = type === 'success' ? '✅' : (type === 'warning' ? '⚠️' : '❌');
            alertMessage.textContent = message;
        }

        function clearAlert() {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';
        }

        function removeInputErrors() {
            document.querySelectorAll('.input-wrapper input').forEach(input => {
                input.classList.remove('input-error');
            });
        }

        // 7. Login Submission Handler (No White Page!)
        async function handleLoginSubmit(e) {
            e.preventDefault();
            clearAlert();
            removeInputErrors();

            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const submitBtn = document.getElementById('loginSubmitBtn');

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showAlert('Please enter both email and password.', 'error');
                if (!email) emailInput.focus();
                else passwordInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> <span>Logging In...</span>';

            try {
                const response = await fetch('login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ email, password })
                });

                let data;
                try {
                    data = await response.json();
                } catch(e) {
                    data = null;
                }

                if (response.ok && data && data.success) {
                    showAlert('✅ Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = data.redirect || 'index.html';
                    }, 500);
                } else {
                    // Login Failed: Keep same email in input field, shake password field and pop up error modal
                    const errorMsg = (data && data.message) ? data.message : 'Invalid Email or Password. Please try again.';
                    
                    // Show in-page popup modal directly on login page
                    showAuthModal({
                        type: 'error',
                        title: 'Invalid Password or Email',
                        message: errorMsg,
                        customAction: 'invalid_password',
                        email: email,
                        focusInputId: 'loginPassword'
                    });

                    // Also display inline alert banner
                    showAlert(errorMsg, 'error');

                    // Highlight and shake password input (keep email intact!)
                    passwordInput.classList.add('input-error');
                    passwordInput.value = '';
                }
            } catch (err) {
                showAuthModal({
                    type: 'error',
                    title: 'Connection Error',
                    message: 'Unable to reach the server. Please check your network connection.',
                    focusInputId: 'loginPassword'
                });
                showAlert('Network error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="btn-text">Log In</span>';
            }
        }

        // 8. Signup Submission Handler (No White Page!)
        async function handleSignupSubmit(e) {
            e.preventDefault();
            clearAlert();
            removeInputErrors();

            const emailInput = document.getElementById('signupEmail');
            const passwordInput = document.getElementById('signupPassword');
            const submitBtn = document.getElementById('signupSubmitBtn');

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showAlert('Please fill in both email and password.', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> <span>Creating Account...</span>';

            try {
                const response = await fetch('signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ email, password })
                });

                let data;
                try {
                    data = await response.json();
                } catch(e) {
                    data = null;
                }

                if (response.ok && data && data.success) {
                    // Account created successfully: Pop up success message & switch to login with email pre-filled
                    showAuthModal({
                        type: 'success',
                        title: '🎉 Account Created!',
                        message: 'Your account was created successfully. Please enter your password to log in.',
                        primaryText: 'Log In Now',
                        email: email
                    });

                    showAlert(data.message || '🎉 Account created! Please log in.', 'success');

                    // Switch to login tab and prefill the exact same email
                    switchAuthTab('login');
                    document.getElementById('loginEmail').value = email;
                    document.getElementById('loginPassword').value = '';
                    document.getElementById('loginPassword').focus();
                } else {
                    // Check if error is "Email already exists" -> provide 1-click option to switch to login with same email
                    const isExisting = data && data.message && (data.message.toLowerCase().includes('already') || data.message.toLowerCase().includes('exists'));
                    const errorMsg = (data && data.message) ? data.message : 'Signup failed. Please try again.';

                    if (isExisting) {
                        showAuthModal({
                            type: 'warning',
                            title: 'Email Already Registered',
                            message: `The email "${email}" is already registered. Would you like to log in with this email instead?`,
                            customAction: 'login_with_email',
                            email: email
                        });
                    } else {
                        showAuthModal({
                            type: 'error',
                            title: 'Sign Up Failed',
                            message: errorMsg,
                            focusInputId: 'signupPassword'
                        });
                    }

                    showAlert(errorMsg, isExisting ? 'warning' : 'error');
                    emailInput.classList.add('input-error');
                }
            } catch (err) {
                showAuthModal({
                    type: 'error',
                    title: 'Connection Error',
                    message: 'Unable to reach the server. Please check your network connection.',
                    focusInputId: 'signupPassword'
                });
                showAlert('Network error. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="btn-text">Create Account</span>';
            }
        }

        // 9. Process URL Query Parameters on page load (e.g. redirects from Servlets/Logout)
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const errorParam = params.get('error');
            const emailParam = params.get('email');
            const tabParam = params.get('tab');
            const msgParam = params.get('msg');
            const logoutParam = params.get('logout');

            if (emailParam) {
                document.getElementById('loginEmail').value = emailParam;
                document.getElementById('signupEmail').value = emailParam;
            }

            if (tabParam === 'signup') {
                switchAuthTab('signup');
            }

            if (errorParam === 'invalid_password' || errorParam === 'invalid_credentials') {
                showAuthModal({
                    type: 'error',
                    title: 'Invalid Password or Email',
                    message: 'The password you entered is incorrect. Please check and try again.',
                    customAction: 'invalid_password',
                    email: emailParam || '',
                    focusInputId: 'loginPassword'
                });
                showAlert('Invalid Email or Password. Please try again.', 'error');
                const pwd = document.getElementById('loginPassword');
                if (pwd) pwd.classList.add('input-error');
            } else if (errorParam === 'email_exists') {
                showAuthModal({
                    type: 'warning',
                    title: 'Email Already Registered',
                    message: `The email "${emailParam || ''}" is already registered. Would you like to log in instead?`,
                    customAction: 'login_with_email',
                    email: emailParam || ''
                });
                showAlert('Email is already registered.', 'warning');
            } else if (logoutParam === '1' || logoutParam === 'true') {
                showAlert('👋 You have been logged out successfully.', 'success');
            } else if (msgParam) {
                showAlert(decodeURIComponent(msgParam), 'success');
            }

            // Clean URL query parameters smoothly without reloading
            if (window.location.search) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
</body>
</html>
