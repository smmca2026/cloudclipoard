<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Forgot Password</title>

<style>

body {

    font-family: Arial;
    background: #141e30;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;

}

.box {

    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 300px;
    text-align: center;

}

input {

    width: 100%;
    padding: 10px;
    margin-top: 10px;

}

button {

    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background: blue;
    color: white;
    border: none;

}

</style>

</head>

<body>

<div class="box">

<h2>Forgot Password</h2>

<form action="forgot" method="post">

<input
type="email"
name="email"
placeholder="Enter Email"
required>

<button type="submit">

Send OTP

</button>

</form>

</div>

</body>

</html>
