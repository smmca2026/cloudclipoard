<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Clipboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1c2541">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Header Actions -->
<header class="app-header">
    <div class="menu-container">
        <button class="icon-btn menu-toggle-btn" id="menuToggleBtn" onclick="toggleMenu()" title="Cloud Files & Menu">
            <span class="btn-icon">📁</span>
            <span class="btn-label">Cloud Files</span>
            <span class="badge" id="fileCountBadge">0</span>
        </button>
    </div>

    <div class="header-right">
        <button class="icon-btn install-btn" id="installAppBtn" onclick="installApp()" title="Install as Mobile / PC App">
            <span class="btn-icon">📲</span>
            <span class="btn-label">Install App</span>
        </button>
        <button class="icon-btn sync-btn" onclick="syncAll()" title="Sync Clipboard & Files from Other Device">
            <span class="btn-icon">🔄</span>
            <span class="btn-label">Sync</span>
        </button>
        <a href="cloudclipboard.apk" download class="apk-download-btn" title="Download Android APK">
            <span class="btn-icon">📱</span>
            <span class="btn-label">APK</span>
        </a>
        <a href="logout" class="logout-btn" title="Logout">
            <span class="btn-icon">🚪</span>
            <span class="btn-label">Logout</span>
        </a>
    </div>
</header>

<!-- Main Container -->
<main class="main-layout">
    <!-- Clipboard Card -->
    <section class="card clipboard-card">
        <div class="card-header">
            <div class="header-title-wrap">
                <span class="cloud-logo">☁️</span>
                <h1>Cloud Clipboard</h1>
            </div>
            <p class="subtitle">Instant real-time sync across all your devices</p>
        </div>

        <div class="input-group">
            <label for="clipboard">Send to Cloud:</label>
            <textarea id="clipboard" placeholder="Type or paste text, links, or notes to sync with other devices..."></textarea>
        </div>

        <div class="action-buttons">
            <button class="btn btn-primary" id="saveBtn" onclick="saveClipboard()">
                <span class="btn-icon">💾</span> Save to Cloud
            </button>
            <button class="btn btn-secondary" id="getBtn" onclick="getClipboard()">
                <span class="btn-icon">📥</span> Get from Cloud
            </button>
        </div>

        <div class="input-group">
            <div class="output-header">
                <label for="output">Received from Cloud:</label>
                <button class="copy-small-btn" onclick="copyOutput()" title="Copy to local clipboard">📋 Copy</button>
            </div>
            <textarea id="output" placeholder="Output from other devices will appear here..." readonly></textarea>
        </div>

        <!-- Saved Clipboard History -->
        <div class="clipboard-history-wrapper">
            <div class="history-header">
                <div class="history-title-wrap">
                    <span>📋 Stored Details & Clipboard History</span>
                    <span id="clipboardCountBadge" class="total-badge">0 items</span>
                </div>
                <div class="history-actions">
                    <button class="copy-small-btn" onclick="loadClipboardHistory()" title="Refresh clipboard history">🔄 Refresh</button>
                    <button class="clear-all-btn" onclick="clearAllClipboard()" title="Clear all stored clipboard items">🗑️ Clear All</button>
                </div>
            </div>
            <div id="clipboardHistoryList" class="clipboard-history-list">
                <div class="loading-files">Loading saved clipboard items...</div>
            </div>
        </div>
    </section>


    <!-- Cloud Files Card / Drawer -->
    <section class="card files-card" id="filesCard">
        <div class="card-header file-header">
            <div class="header-title-wrap">
                <span class="cloud-logo">📂</span>
                <h2>Cloud File Hub</h2>
            </div>
            <button class="refresh-files-btn" onclick="loadFiles()" title="Refresh file list">🔄 Refresh</button>
        </div>
        <p class="subtitle">Upload multiple files from PC/Phone & download on any device</p>

        <!-- Upload Box -->
        <form id="uploadForm" class="upload-box" enctype="multipart/form-data">
            <input type="file" name="files" id="file" multiple class="file-input" onchange="updateSelectedFilesText(this)">
            <label for="file" class="file-dropzone" id="dropzoneLabel">
                <span class="upload-icon">📤</span>
                <span class="dropzone-text" id="dropzoneText">Choose files or Drag & Drop here</span>
                <span class="dropzone-hint">Supports multiple files (images, docs, pdfs, zips)</span>
            </label>
            <button type="submit" class="btn btn-upload" id="uploadSubmitBtn">
                <span>Upload to Cloud</span>
            </button>
        </form>

        <!-- Upload Progress / Status -->
        <div id="uploadStatus" class="status-msg"></div>

        <!-- Files List -->
        <div class="files-list-wrapper">
            <div class="files-list-header">
                <span>Available Files on Cloud</span>
                <span id="totalFilesInfo" class="total-badge">0 files</span>
            </div>
            <div id="filesList" class="files-list">
                <div class="loading-files">Loading cloud files...</div>
            </div>
        </div>
    </section>
</main>

<!-- Hidden link for legacy support -->
<a id="downloadLink" style="display:none;"></a>

<!-- Notification Toast -->
<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
