<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Verify OTP</title>

<style>

body {

    font-family: Arial;
    background: #141e30;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;

}

.box {

    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 300px;
    text-align: center;

}

input {

    width: 100%;
    padding: 10px;
    margin-top: 10px;
    box-sizing: border-box;

}

button {

    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background: blue;
    color: white;
    border: none;
    cursor: pointer;

}

</style>

</head>

<body>

<div class="box">

<h2>Verify OTP</h2>

<form action="verifyOtp" method="post">

<input
type="text"
name="otp"
placeholder="Enter OTP"
required>

<button type="submit">

Verify OTP

</button>

</form>

</div>

</body>

</html>
