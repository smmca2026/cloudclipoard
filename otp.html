<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Cloud Clipboard</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a1128 0%, #1c2541 50%, #0b132b 100%);
            --card-bg: rgba(25, 38, 70, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-blue: #3a86ff;
            --accent-blue-hover: #2563eb;
            --accent-cyan: #00f0ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
            --radius-lg: 18px;
            --radius-md: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 34px 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .logo-icon {
            font-size: 36px;
            margin-bottom: 8px;
            display: inline-block;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .alert-box {
            display: none;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            margin-bottom: 16px;
            text-align: left;
        }

        .alert-box.success {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .alert-box.error {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            padding: 14px;
            font-size: 18px;
            letter-spacing: 4px;
            text-align: center;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(58, 134, 255, 0.25);
        }

        button.btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        button.btn-submit:hover {
            background: var(--accent-blue-hover);
            transform: translateY(-1px);
        }

        button.btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="box">
    <span class="logo-icon">📩</span>
    <h2>Verify OTP</h2>
    <p class="subtitle">Enter the 6-digit code sent to your email</p>

    <div id="alertBox" class="alert-box">
        <span id="alertIcon"></span>
        <span id="alertMsg"></span>
    </div>

    <form id="otpForm" onsubmit="handleOtpSubmit(event)">
        <div class="input-group">
            <label for="otp">6-Digit OTP Code</label>
            <input type="text" id="otp" name="otp" placeholder="123456" maxlength="6" required autocomplete="one-time-code">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Verify Code</button>
    </form>

    <a href="forgot.html" class="back-link">← Request New OTP</a>
</div>

<script>
    function showAlert(msg, type = 'error') {
        const alertBox = document.getElementById('alertBox');
        const alertIcon = document.getElementById('alertIcon');
        const alertMsg = document.getElementById('alertMsg');
        alertBox.className = `alert-box ${type}`;
        alertIcon.textContent = type === 'success' ? '✅' : '⚠️';
        alertMsg.textContent = msg;
    }

    async function handleOtpSubmit(e) {
        e.preventDefault();
        const otp = document.getElementById('otp').value.trim();
        const submitBtn = document.getElementById('submitBtn');

        if (!otp) {
            showAlert('Please enter the OTP code.', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying...';

        try {
            const res = await fetch('verifyOtp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ otp })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showAlert('✅ OTP Verified! Redirecting to password reset...', 'success');
                setTimeout(() => {
                    window.location.href = data.redirect || 'resetPassword.html';
                }, 800);
            } else {
                showAlert(data.message || 'Invalid or expired OTP.', 'error');
            }
        } catch (err) {
            showAlert('Verification failed. Please try again.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Verify Code';
        }
    }
</script>

</body>
</html>
