<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Cloud Clipboard</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a1128 0%, #1c2541 50%, #0b132b 100%);
            --card-bg: rgba(25, 38, 70, 0.85);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-blue: #3a86ff;
            --accent-blue-hover: #2563eb;
            --accent-cyan: #00f0ff;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
            --radius-lg: 18px;
            --radius-md: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 34px 28px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .logo-icon {
            font-size: 36px;
            margin-bottom: 8px;
            display: inline-block;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 22px;
        }

        .alert-box {
            display: none;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 13px;
            margin-bottom: 16px;
            text-align: left;
        }

        .alert-box.success {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .alert-box.error {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .input-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            padding: 12px 42px 12px 14px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(58, 134, 255, 0.25);
        }

        .eye-toggle-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            padding: 6px;
            border-radius: 6px;
            transition: color 0.2s, transform 0.15s;
        }

        .eye-toggle-btn:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        .eye-toggle-btn svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        button.btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--accent-blue);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        button.btn-submit:hover {
            background: var(--accent-blue-hover);
            transform: translateY(-1px);
        }

        button.btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            display: inline-block;
            margin-top: 18px;
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="box">
    <span class="logo-icon">🔒</span>
    <h2>Reset Password</h2>
    <p class="subtitle">Enter your new secure password</p>

    <div id="alertBox" class="alert-box">
        <span id="alertIcon"></span>
        <span id="alertMsg"></span>
    </div>

    <form id="resetForm" onsubmit="handleResetPassword(event)">
        <div class="input-group">
            <label for="newPassword">New Password</label>
            <div class="input-wrapper">
                <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required autocomplete="new-password">
                <button type="button" class="eye-toggle-btn" onclick="togglePasswordVisibility('newPassword', this)" title="Toggle password visibility" aria-label="Show password">
                    <svg class="eye-icon-closed" viewBox="0 0 24 24">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    <svg class="eye-icon-open" viewBox="0 0 24 24" style="display:none;">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Update Password</button>
    </form>

    <a href="auth.html" class="back-link">← Back to Login</a>
</div>

<script>
    function togglePasswordVisibility(inputId, button) {
        const input = document.getElementById(inputId);
        if (!input) return;

        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';

        const closedIcon = button.querySelector('.eye-icon-closed');
        const openIcon = button.querySelector('.eye-icon-open');

        if (isPassword) {
            if (closedIcon) closedIcon.style.display = 'none';
            if (openIcon) openIcon.style.display = 'block';
            button.setAttribute('aria-label', 'Hide password');
        } else {
            if (closedIcon) closedIcon.style.display = 'block';
            if (openIcon) openIcon.style.display = 'none';
            button.setAttribute('aria-label', 'Show password');
        }
    }

    function showAlert(msg, type = 'error') {
        const alertBox = document.getElementById('alertBox');
        const alertIcon = document.getElementById('alertIcon');
        const alertMsg = document.getElementById('alertMsg');
        alertBox.className = `alert-box ${type}`;
        alertIcon.textContent = type === 'success' ? '✅' : '⚠️';
        alertMsg.textContent = msg;
    }

    async function handleResetPassword(e) {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword').value;
        const submitBtn = document.getElementById('submitBtn');

        if (!newPassword) {
            showAlert('Please enter a new password.', 'error');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Updating...';

        try {
            const res = await fetch('resetPassword', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ newPassword })
            });
            const data = await res.json();
            if (res.ok && data.success) {
                showAlert('✅ Password updated successfully! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = data.redirect || 'auth.html';
                }, 1200);
            } else {
                showAlert(data.message || 'Error updating password.', 'error');
            }
        } catch (err) {
            showAlert('Failed to update password. Please try again.', 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Update Password';
        }
    }
</script>

</body>
</html>
